{{- if and .Values.service.enabled .Values.service.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Values.service.name }}-hpa
  namespace: {{ .Values.global.namespace | default "default" }}
  labels:
    app.kubernetes.io/name: {{ .Values.service.name }}
    app.kubernetes.io/part-of: t2s-platform
spec:
  {{- $minReplicas := 1 }}
  {{- if and .Values.service.autoscaling (hasKey .Values.service.autoscaling "minReplicas") }}
  {{- $minReplicas = .Values.service.autoscaling.minReplicas }}
  {{- end }}
  minReplicas: {{ $minReplicas }}
  maxReplicas: {{ .Values.service.autoscaling.maxReplicas | default 2 }}
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.service.name }}-predictor-default
  metrics:
    {{- if and .Values.service.autoscaling.cpu.enabled .Values.service.autoscaling.cpu.targetUtilization }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.service.autoscaling.cpu.targetUtilization }}
    {{- end }}
    {{- if and .Values.service.autoscaling.memory.enabled .Values.service.autoscaling.memory.targetUtilization }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.service.autoscaling.memory.targetUtilization }}
    {{- end }}
    {{- if and .Values.service.resources.gpu.enabled .Values.service.autoscaling.gpu.enabled }}
    - type: Pods
      pods:
        metric:
          name: {{ .Values.service.autoscaling.gpu.metricName | default "gpu_utilization" }}
        target:
          type: AverageValue
          averageValue: {{ .Values.service.autoscaling.gpu.targetAverageValue | default "70" }}
    {{- end }}
  {{- if .Values.service.autoscaling.behavior }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: {{ .Values.service.autoscaling.behavior.scaleUp.stabilizationWindowSeconds | default 60 }}
      policies:
        {{- toYaml .Values.service.autoscaling.behavior.scaleUp.policies | nindent 8 }}
    scaleDown:
      stabilizationWindowSeconds: {{ .Values.service.autoscaling.behavior.scaleDown.stabilizationWindowSeconds | default 300 }}
      policies:
        {{- toYaml .Values.service.autoscaling.behavior.scaleDown.policies | nindent 8 }}
  {{- end }}
{{- end }}
