global:
  namespace: t2s-system

service:
  enabled: true
  name: norm-openai
  displayName: OpenAI Normalization Proxy
  image:
    repository: t2sv3-norm-openai
    tag: latest
    pullPolicy: IfNotPresent
  port: 8080
  env:
    - name: GOOGLE_API_KEY
      value: "" 
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
    gpu:
      enabled: false
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
  pvc:
    enabled: false
